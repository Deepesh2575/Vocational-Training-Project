version: '3.8'

services:
  nginx-pqc:
    image: openquantumsafe/nginx:latest
    ports:
      - "4443:4433"
    volumes:
      - ./nginx/nginx.conf:/opt/nginx/nginx-conf/nginx.conf:ro
      - ./certs:/opt/nginx/certs:ro
    environment:
      - NGINX_PORT=4433

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "4001:4001"    # p2p
      - "5001:5001"    # API
      - "8080:8080"    # Gateway
    volumes:
      - ./ipfs_data:/data/ipfs
