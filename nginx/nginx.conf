worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       4433 ssl;
        server_name  localhost;

        # TLS configuration
        ssl_certificate      /opt/nginx/certs/server.crt;
        ssl_certificate_key  /opt/nginx/certs/server.key;

        # Enforce TLS 1.3
        ssl_protocols TLSv1.3;
        
        # Enforce Hybrid Post-Quantum Key Exchange
        # Let openquantumsafe auto-negotiate its default compiled PQC curves
        # ssl_ecdh_curve x25519_mlkem768;

        location / {
            return 200 '{"status": "success", "message": "Secure Hybrid PQC Connection Established!"}\n';
            add_header Content-Type application/json;
        }
    }
}
