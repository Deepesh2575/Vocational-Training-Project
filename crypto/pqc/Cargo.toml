[package]
name = "crypto-pqc"
version = "0.1.0"
edition = "2021"

[lib]
name = "crypto_pqc"
crate-type = ["cdylib", "rlib"]

[dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hkdf = "0.12"
pqc_kyber = { version = "0.7.1", features = ["std"] }
x25519-dalek = { version = "2.0.0", features = ["static_secrets"] }
pyo3 = { version = "0.21.2", features = ["extension-module"] }
ml-dsa = "0.1.1"
